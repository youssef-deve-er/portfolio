<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — الصفحة غير موجودة | يوسف بن عياد</title>

    <!-- لا تُفهرس صفحة الخطأ -->
    <meta name="robots" content="noindex, follow">
    <meta name="description" content="الصفحة المطلوبة غير موجودة على موقع يوسف بن عياد.">
    <link rel="icon" href="/portfolio/favicon.svg" type="image/svg+xml">
    <meta name="theme-color" content="#0b0f19">

    <!--
        صفحة مستقلة تماماً بأنماط مضمّنة.
        السبب: GitHub Pages يخدم هذا الملف من أي مسار عميق (‏/portfolio/a/b/c)،
        فأي رابط نسبي لملف CSS خارجي سينكسر. الإدماج يضمن ظهورها صحيحة دائماً.
    -->
    <script>
        (function () {
            var root = document.documentElement;
            try {
                var theme = localStorage.getItem("theme")
                    || (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
                var lang = localStorage.getItem("lang")
                    || ((navigator.language || "ar").toLowerCase().indexOf("ar") === 0 ? "ar" : "en");
                root.setAttribute("data-theme", theme);
                root.setAttribute("lang", lang);
                root.setAttribute("dir", lang === "ar" ? "rtl" : "ltr");
            } catch (e) {
                root.setAttribute("data-theme", "dark");
            }
        })();
    </script>

    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(20, 15, 35, 0.5);
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --primary-color: #38bdf8;
            --accent-purple: #a855f7;
            --btn-bg: #38bdf8;
            --btn-bg-hover: #7dd3fc;
            --btn-fg: #0b0f19;
            --border-color: rgba(255, 255, 255, 0.08);
            --focus-ring: #7dd3fc;
        }

        [data-theme="light"] {
            --bg-color: #f1f5f9;
            --card-bg: rgba(255, 255, 255, 0.85);
            --text-color: #0f172a;
            --text-muted: #475569;
            --primary-color: #0369a1;
            --accent-purple: #7e22ce;
            --btn-bg: #0369a1;
            --btn-bg-hover: #075985;
            --btn-fg: #ffffff;
            --border-color: rgba(0, 0, 0, 0.1);
            --focus-ring: #0369a1;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 32px 20px;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.7;
            text-align: center;
        }

        .error-code {
            font-size: clamp(4.5rem, 3rem + 7.5vw, 9rem);
            font-weight: 800;
            line-height: 1;
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, var(--primary-color), var(--accent-purple));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        h1 {
            font-size: clamp(1.35rem, 1.2rem + 0.73vw, 1.8rem);
            margin: 14px 0 12px;
        }

        .lead {
            max-width: 460px;
            margin: 0 auto 34px;
            color: var(--text-muted);
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 13px;
            margin-bottom: 44px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 46px;
            padding: 12px 26px;
            border: 1px solid transparent;
            border-radius: 10px;
            font: inherit;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            transition: transform 0.2s ease, background-color 0.2s ease, color 0.2s ease;
        }

        .btn:hover { transform: translateY(-2px); }

        .btn-primary { background: var(--btn-bg); color: var(--btn-fg); }
        .btn-primary:hover { background: var(--btn-bg-hover); }

        .btn-outline {
            border-color: var(--primary-color);
            color: var(--primary-color);
            background: transparent;
        }

        .btn-outline:hover { background: var(--primary-color); color: var(--btn-fg); }
        [data-theme="light"] .btn-outline:hover { color: #ffffff; }

        .quick-links {
            padding-top: 26px;
            border-top: 1px solid var(--border-color);
        }

        .quick-links p {
            font-size: 0.82rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            margin-bottom: 14px;
        }

        .quick-links ul {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px 20px;
            list-style: none;
        }

        .quick-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s ease;
        }

        .quick-links a:hover { color: var(--primary-color); }

        :where(a, button):focus-visible {
            outline: 3px solid var(--focus-ring);
            outline-offset: 3px;
            border-radius: 6px;
        }

        @media (prefers-reduced-motion: reduce) {
            * { transition-duration: 0.01ms !important; }
            .btn:hover { transform: none; }
        }
    </style>
</head>
<body>
    <main>
        <p class="error-code" aria-hidden="true">404</p>

        <h1 data-ar="الصفحة غير موجودة" data-en="Page not found">الصفحة غير موجودة</h1>

        <p class="lead"
           data-ar="يبدو أن هذا الرابط لم يعد موجوداً أو تم نقله. لنعُد بك إلى الطريق الصحيح."
           data-en="This link no longer exists or has moved. Let's get you back on track.">
            يبدو أن هذا الرابط لم يعد موجوداً أو تم نقله. لنعُد بك إلى الطريق الصحيح.
        </p>

        <div class="actions">
            <a href="/portfolio/" class="btn btn-primary"
               data-ar="العودة للرئيسية" data-en="Back to home">العودة للرئيسية</a>
            <button type="button" id="go-back" class="btn btn-outline"
                    data-ar="الصفحة السابقة" data-en="Previous page">الصفحة السابقة</button>
        </div>

        <nav class="quick-links" aria-label="روابط سريعة">
            <p data-ar="روابط سريعة" data-en="Quick links">روابط سريعة</p>
            <ul>
                <li><a href="/portfolio/#journey"  data-ar="رحلتي"    data-en="Journey">رحلتي</a></li>
                <li><a href="/portfolio/#services" data-ar="الخدمات"  data-en="Services">الخدمات</a></li>
                <li><a href="/portfolio/#projects" data-ar="المشاريع" data-en="Projects">المشاريع</a></li>
                <li><a href="/portfolio/#contact"  data-ar="تواصل"    data-en="Contact">تواصل</a></li>
                <li><a href="https://github.com/youssef-deve-er" target="_blank" rel="noopener noreferrer">GitHub</a></li>
            </ul>
        </nav>
    </main>

    <script>
        (function () {
            var lang = document.documentElement.getAttribute("lang") === "en" ? "en" : "ar";

            document.querySelectorAll("[data-ar][data-en]").forEach(function (el) {
                var value = el.getAttribute("data-" + lang);
                if (value !== null) el.textContent = value;
            });

            document.title = lang === "ar"
                ? "404 — الصفحة غير موجودة | يوسف بن عياد"
                : "404 — Page not found | Youssef Ben Ayed";

            var backBtn = document.getElementById("go-back");

            // أخفِ الزر إن لم يكن هناك سجل تصفح داخل الموقع (دخول مباشر)
            if (history.length <= 1) {
                backBtn.style.display = "none";
            } else {
                backBtn.addEventListener("click", function () { history.back(); });
            }
        })();
    </script>
</body>
</html>
